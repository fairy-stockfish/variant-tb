name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per supported variant. "targets" are the make targets
          # in src/Makefile that build the binaries the test needs.
          - variant: regular
            targets: rtbgen rtbgenp rtbver rtbverp tbcheck
          - variant: atomic
            targets: atbgen atbgenp atbver atbverp tbcheck
          - variant: suicide
            targets: stbgen stbgenp stbver stbverp tbcheck
          - variant: giveaway
            targets: gtbgen gtbgenp gtbver gtbverp tbcheck
          - variant: shatranj
            targets: jtbgen jtbgenp jtbver jtbverp tbcheck
          - variant: racing
            targets: ktbgen ktbver tbcheck
          - variant: schess
            targets: etbgen etbgenp etbver etbverp tbcheck

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Build
        # Built sequentially: the sub-makes of different targets share
        # object directories and are not safe to run in parallel.
        run: |
          for t in ${{ matrix.targets }}; do
            make -C src "$t"
          done

      - name: Generate and verify tables
        run: python3 tests/variant_test.py ${{ matrix.variant }} -t "$(nproc)"
